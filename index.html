<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Modular App</title>
  <link rel="stylesheet" href="styles.css" />
  <script>
    /* Apply theme early to avoid flash */
    (function () {
      try {
        var t = localStorage.getItem('app-theme');
        if (t === 'dark' || t === 'light') {
          document.documentElement.setAttribute('data-theme', t);
        } else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
          document.documentElement.setAttribute('data-theme', 'dark');
        } else {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    })();
  </script>
</head>
<body>
  <div id="app">
    <header id="navbar-root" class="navbar-root"></header>
    <main id="module-root" class="module-root" aria-live="polite"></main>
  </div>
  <script type="module" src="js/main.js"></script>
  <script>document.body.style.userSelect = "none"; </script>
</body>
</html>
